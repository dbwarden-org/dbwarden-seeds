[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "dbwarden-seeds"
version = "0.1.3"
description = "Seed data management for dbwarden"
readme = "README.md"
requires-python = ">=3.12.7"
dependencies = ["dbwarden>=0.20.0"]

[project.urls]
Homepage = "https://github.com/dbwarden-org/dbwarden-seeds"
Source = "https://github.com/dbwarden-org/dbwarden-seeds"

[project.entry-points."dbwarden.plugins"]
seeds = "dbwarden_seeds:setup"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[dependency-groups]
dev = [
    "pytest",
    "pytest-cov",
    "aiosqlite",
]
